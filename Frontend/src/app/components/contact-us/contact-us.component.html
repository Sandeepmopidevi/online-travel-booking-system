<div class="container mt-5">
  <div class="text-center mb-4">
    <h1>Contact Us</h1>
    <p class="lead">We'd love to hear from you! Please fill out the form below to get in touch.</p>
  </div>

  <!-- Contact Form -->
  <form 
    (ngSubmit)="onSubmit(contactForm)" 
    #contactForm="ngForm" 
    class="needs-validation p-4 shadow rounded bg-light" 
    novalidate
  >
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="name" class="form-label">Your Name</label>
        <input 
          type="text" 
          id="name" 
          class="form-control" 
          required 
          name="name" 
          ngModel
        >
      </div>
      <div class="col-md-6 mb-3">
        <label for="email" class="form-label">Your Email</label>
        <input 
          type="email" 
          id="email" 
          class="form-control" 
          required 
          name="email" 
          ngModel
        >
      </div>
    </div>
    <div class="mb-3">
      <label for="subject" class="form-label">Subject</label>
      <input 
        type="text" 
        id="subject" 
        class="form-control" 
        required 
        name="subject" 
        ngModel
      >
    </div>
    <div class="mb-3">
      <label for="message" class="form-label">Message</label>
      <textarea 
        id="message" 
        class="form-control" 
        rows="5" 
        required 
        name="message" 
        ngModel
      ></textarea>
    </div>
    <button 
      type="submit" 
      class="btn btn-primary btn-lg w-100" 
      [disabled]="!contactForm.form.valid"
    >
      Submit
    </button>
  </form>
</div>
