<div class="container my-4">
    <h2>Support Tickets</h2>
    <button class="btn btn-success mb-3" (click)="startCreate()" *ngIf="!isCreating && !isEditing">Create New Ticket</button>
  
    <!-- Form for Create or Edit -->
    <div *ngIf="isCreating || isEditing" class="card p-4 mb-4">
      <h4 *ngIf="isCreating">Create Support Ticket</h4>
      <h4 *ngIf="isEditing">Edit Support Ticket #{{ selectedTicket?.ticketID }}</h4>
      <form (ngSubmit)="submitForm()">
        <div class="mb-3">
          <label class="form-label">Status</label>
          <select class="form-select" [(ngModel)]="ticketForm.status" name="status" required>
            <option value="Open">Open</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
            <option value="Closed">Closed</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Issue</label>
          <textarea class="form-control" [(ngModel)]="ticketForm.issue" name="issue" rows="3" required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Assigned Agent</label>
          <input class="form-control" [(ngModel)]="ticketForm.assignedAgent" name="assignedAgent" />
        </div>
        <div class="mb-3">
          <label class="form-label">User ID</label>
          <input class="form-control" [(ngModel)]="ticketForm.userId" name="userId" required type="number" min="1" />
        </div>
        <button class="btn btn-primary" type="submit">{{ isCreating ? 'Create' : 'Save' }}</button>
        <button class="btn btn-secondary ms-2" type="button" (click)="cancel()">Cancel</button>
      </form>
    </div>
  
    <!-- Tickets table -->
    <div *ngIf="isLoading" class="text-center my-4">
      <div class="spinner-border text-primary" role="status"></div>
    </div>
    <table class="table table-bordered table-striped" *ngIf="!isLoading && tickets.length">
      <thead>
        <tr>
          <th>ID</th>
          <th>Status</th>
          <th>Issue</th>
          <th>Assigned Agent</th>
          <th>User ID</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let ticket of tickets">
          <td>{{ticket.ticketID}}</td>
          <td>{{ticket.status}}</td>
          <td>{{ticket.issue}}</td>
          <td>{{ticket.assignedAgent || '-'}}</td>
          <td>{{ticket.userID}}</td>
          <td>
            <button class="btn btn-sm btn-primary" (click)="startEdit(ticket)">Edit</button>
            <button class="btn btn-sm btn-danger ms-2" (click)="confirmDelete(ticket)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="!isLoading && !tickets.length" class="text-center">
      <em>No support tickets found.</em>
    </div>
  </div>
