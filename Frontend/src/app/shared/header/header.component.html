<header class="navbar navbar-expand-lg custom-navbar">
  <div class="container-fluid">
    <!-- Toggle Sidebar Button (Visible only when logged in) -->
    <button *ngIf="isLoggedIn" class="btn text-white me-3" (click)="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Logo and Title -->
    <div class="d-flex align-items-center">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="assets/logo.png" alt="Stayora Logo" class="logo me-2" />
        {{ title }}
      </a>
    </div>

    <!-- Right-Side Navbar -->
    <div class="d-flex ms-auto">
      <!-- Menu links: Only show if NOT logged in -->
      <ul class="navbar-nav" *ngIf="!isLoggedIn">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/about">Why Choose Us?</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contact-us">Contact Us</a>
        </li>
      </ul>

      <!-- Conditionally Render Login/Logout -->
      <div class="ms-3">
        <ng-container *ngIf="!isLoggedIn; else loggedInTemplate">
          <a
            routerLink="/login"
            class="btn btn-outline-light login-btn glow-effect me-2"
            role="button"
          >
            Login
          </a>
        </ng-container>

        <ng-template #loggedInTemplate>
          <div class="d-flex align-items-center">
            <span *ngIf="userRole" class="badge bg-gradient-role me-2">{{ userRole }}</span>
            <button class="btn btn-outline-danger" (click)="logout()">Logout</button>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</header>
