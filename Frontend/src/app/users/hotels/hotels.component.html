<div class="container my-5">
  <h2 class="text-center mb-4">Available Hotels</h2>

  <form class="row mb-4 justify-content-center" (ngSubmit)="searchHotels()" autocomplete="off">
    <div class="col-md-3 mb-2">
      <input type="text" class="form-control" placeholder="Search by Hotel Name" [(ngModel)]="searchName" name="searchName" />
    </div>
    <div class="col-md-3 mb-2">
      <input type="text" class="form-control" placeholder="Search by Location" [(ngModel)]="searchLocation" name="searchLocation" />
    </div>
    <div class="col-md-3 mb-2 d-flex gap-2">
      <button type="submit" class="btn btn-primary w-100">Search</button>
      <button type="button" class="btn btn-secondary w-100" (click)="resetSearch()">Reset</button>
    </div>
  </form>

  <div *ngIf="isLoading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
  <div class="row" *ngIf="!isLoading && filteredHotels.length">
    <div class="col-md-4 mb-4" *ngFor="let hotel of filteredHotels">
      <div class="card h-100">
        <img
          [src]="'assets/' + hotel.image"
          class="card-img-top"
          (error)="onImageError($event)"
          alt="{{ hotel.name }}"
          style="height: 200px; object-fit: cover;"
        />
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ hotel.name }}</h5>
          <p class="card-text">
            <strong>Location:</strong> {{ hotel.location }}
          </p>
          <p class="card-text">
            <strong>Price Per Night:</strong>
            {{ hotel.pricePerNight | currency: 'INR' }}
          </p>
          <button
            class="btn btn-primary mt-auto"
            (click)="navigateToPayment(hotel)"
            [disabled]="isRedirecting"
          >
            {{ isRedirecting ? 'Redirecting...' : 'Pay Now' }}
          </button>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="!isLoading && filteredHotels.length === 0" class="text-center">
    <p class="text-muted">No hotels available.</p>
  </div>
</div>
